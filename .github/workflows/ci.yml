name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository structure and YAML
        run: |
          python -m pip install --upgrade pip pyyaml
          python - <<'PY'
          import pathlib
          import yaml

          required = [
              pathlib.Path('README.md'),
              pathlib.Path('LICENSE'),
              pathlib.Path('CONTRIBUTING.md'),
              pathlib.Path('SECURITY.md'),
              pathlib.Path('SUPPORT.md'),
              pathlib.Path('.github/ISSUE_TEMPLATE/config.yml'),
              pathlib.Path('.github/ISSUE_TEMPLATE/bug_report.yml'),
              pathlib.Path('.github/ISSUE_TEMPLATE/feature_request.yml'),
          ]

          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')

          yaml_files = [
              p for p in pathlib.Path('.').rglob('*')
              if p.suffix in {'.yml', '.yaml'} and '.git' not in p.parts
          ]

          for path in yaml_files:
              with path.open('r', encoding='utf-8') as fh:
                  yaml.safe_load(fh)

          print(f'Validated {len(yaml_files)} YAML file(s) and required repo files.')
          PY

      - name: Check for required documentation markers
        run: |
          grep -q "Ann Lite" README.md
          grep -q "Security Policy" SECURITY.md
          grep -q "Support" SUPPORT.md
          grep -q "Contributing" CONTRIBUTING.md
          echo "Documentation checks passed."
