name: Feature request
description: Propose a new feature or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        If this is about a specific product repository, consider
        filing it there instead — it'll reach the right maintainers
        faster.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles check
      description: See ann-lite-docs/docs/PROJECT_OVERVIEW.md
      options:
        - label: This request does not imply any false spiritual or financial promise
          required: true
        - label: This request does not expose personal data about vulnerable people
          required: true
